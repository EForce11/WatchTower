name: CI

on:
  push:
    branches: [ master, develop, 'task-*' ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.24.x'
        cache: true
    - run: go mod download
    - run: go vet ./...
    - run: go test -race -timeout 5m ./...

  lint:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.24.x'
        cache: true
    - uses: golangci/golangci-lint-action@v3
      with:
        version: v1.64.8
        args: --timeout=5m
