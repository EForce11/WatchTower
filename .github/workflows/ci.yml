name: CI

on:
  push:
    branches: [ master, develop, 'task-*', 'feat/*', 'fix/*', 'ci/*' ]
  pull_request:
    branches: [ master ]

# Node 24 uyarısını susturmak ve geleceğe hazırlık için eklediğimiz blok
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: |
          # Measure coverage only on packages with meaningful business logic.
          # Excludes: cmd/ (main packages — not unit-testable), pkg/protocol (generated protobuf code).
          # To add a new testable package, include it here.
          TESTABLE=$(go list ./internal/...)
          go test -race -timeout 5m \
            -coverprofile=coverage.out \
            -covermode=atomic \
            $TESTABLE

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          # Threshold applies to testable packages only (excludes cmd/ and generated code).
          # Current baseline: internal/sentry ~80%. Raise this threshold as new packages gain tests.
          if awk "BEGIN {exit !($COVERAGE < 75)}"; then
            echo "❌ Coverage ${COVERAGE}% is below the 75% minimum threshold"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets the threshold"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: unit
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5 
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true
          
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

  security:
    name: Security (gosec)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4

      - name: Run gosec
        run: gosec -fmt=sarif -out=gosec-results.sarif -severity=medium -confidence=medium ./...
        continue-on-error: true

      - name: Upload gosec SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif
          category: gosec